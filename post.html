<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Article — Verifitrust</title>
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --primary: #69be28;
    --primary-dark: #4f9e1a;
    --secondary: #071A2b;
    --white: #ffffff;
  }
  *{ -webkit-font-smoothing: antialiased; }
  body{
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--white);
    color: var(--secondary);
    overflow-x: hidden;
  }
  .font-serif{ font-family: 'Instrument Serif', serif; font-weight: 400; }
  ::-webkit-scrollbar{ width: 10px; }
  ::-webkit-scrollbar-track{ background: #f1f5f9; }
  ::-webkit-scrollbar-thumb{ background: #69be28; border-radius: 5px; }
  ::selection{ background: #69be28; color: #071A2b; }
  html{ scroll-behavior: smooth; }

  .btn-primary{
    background: var(--primary);
    color: var(--secondary);
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 4px 14px rgba(105,190,40,0.3);
  }
  .btn-primary:hover{
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(105,190,40,0.4);
  }

  .mobile-menu{
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .mobile-menu.open{ transform: translateX(0); }

  /* BLOG CONTENT STYLING */
  .prose {
    color: #334155;
    font-size: 1.125rem; 
    line-height: 1.75;
  }
  .prose h2 { font-size: 1.875rem; font-weight: 700; color: #071A2b; margin-top: 2.5rem; margin-bottom: 1rem; line-height: 1.3; }
  .prose h3 { font-size: 1.5rem; font-weight: 700; color: #071A2b; margin-top: 2rem; margin-bottom: 0.75rem; line-height: 1.4; }
  .prose p { margin-bottom: 1.5rem; }
  .prose ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 1.5rem; }
  .prose ul li { margin-bottom: 0.5rem; }
  .prose a { color: #4f9e1a; font-weight: 600; text-decoration: underline; transition: color 0.2s; }
  .prose a:hover { color: #69be28; }
  .prose blockquote { border-left: 4px solid #69be28; background: #f8fafc; padding: 1rem 1.5rem; font-style: italic; color: #475569; margin: 1.5rem 0; border-radius: 0 8px 8px 0; }
  .prose strong { font-weight: 700; color: #071A2b; }
  
  .fade-up{
    opacity: 0;
    transform: translateY(40px);
    transition: all 0.8s cubic-bezier(0.4,0,0.2,1);
  }
  .fade-up.visible{ opacity: 1; transform: translateY(0); }

  .share-btn { transition: all 0.2s ease; }
  .share-btn:hover { transform: translateY(-2px); }
</style>
</head>
<body class="bg-white">

<!-- ============ HEADER ============ -->
<div id="header-include"></div>

<!-- ============ ARTICLE CONTAINER ============ -->
<section class="relative pt-32 pb-20 lg:pt-40 lg:pb-28 overflow-hidden bg-white">
  <div class="max-w-3xl mx-auto px-5 sm:px-6 lg:px-8">
    
    <!-- Dynamic Back Button -->
    <a href="/resources/blog.html" id="back-btn" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-[#69be28] mb-8 transition-colors">
      <i class="fas fa-arrow-left text-xs"></i> <span id="back-text">Back to Blog</span>
    </a>

    <!-- Dynamic Category Tag -->
    <div class="mb-4 fade-up">
      <span id="post-category" class="px-3 py-1 bg-[#69be28]/10 text-[#69be28] text-[11px] font-bold uppercase tracking-wider rounded-full">Article</span>
    </div>

    <!-- Title Area -->
    <h1 id="post-title" class="text-3xl md:text-5xl font-bold tracking-tight text-[#071A2b] mb-6 fade-up"></h1>

    <!-- Author Info Row -->
    <div class="flex items-center gap-4 mb-8 fade-up">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" alt="Author" class="w-12 h-12 rounded-full object-cover border-2 border-[#69be28]">
      <div>
        <p class="font-bold text-[#071A2b] text-sm">Verifitrust Team</p>
        <p id="post-date" class="text-slate-500 text-xs">Loading date...</p>
      </div>
    </div>

    <!-- Feature Image Container -->
    <div id="post-image-container" class="mb-10"></div>

    <!-- Content Area -->
    <article id="post-content" class="prose fade-up">
      <p class="text-slate-500">Loading article...</p>
    </article>

    <!-- ============ SHARE OPTIONS ============ -->
    <div class="mt-12 pt-8 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p class="text-sm font-bold text-[#071A2b] uppercase tracking-wider">Share this article:</p>
      <div class="flex items-center gap-3">
        <a href="#" id="share-linkedin" target="_blank" class="share-btn w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-[#0077B5] text-slate-600 hover:text-white rounded-full">
          <i class="fab fa-linkedin-in"></i>
        </a>
        <a href="#" id="share-twitter" target="_blank" class="share-btn w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-black text-slate-600 hover:text-white rounded-full">
          <i class="fab fa-x-twitter"></i>
        </a>
        <a href="#" id="share-facebook" target="_blank" class="share-btn w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-[#1877F2] text-slate-600 hover:text-white rounded-full">
          <i class="fab fa-facebook-f"></i>
        </a>
        <button id="copy-link-btn" class="share-btn w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-[#69be28] text-slate-600 hover:text-[#071A2b] rounded-full">
          <i class="fas fa-link"></i>
        </button>
      </div>
    </div>

    <!-- ============ COMMENTS SECTION ============ -->
    <div class="mt-16">
      <h3 class="text-2xl font-bold text-[#071A2b] mb-6">Join the conversation <span class="text-slate-400 text-lg">(0 Comments)</span></h3>
      <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 mb-8">
        <textarea placeholder="Share your thoughts..." class="w-full p-4 bg-white rounded-xl border border-slate-200 focus:outline-none focus:border-[#69be28] focus:ring-2 focus:ring-[#69be28]/20 resize-none mb-3" rows="3"></textarea>
        <div class="flex justify-end">
          <button class="btn-primary px-5 py-2 rounded-full font-semibold text-sm">Post Comment</button>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- ============ FOOTER ============ -->
<div id="footer-include"></div>

<!-- Load global scripts -->
<script src="/main.js"></script>

<!-- Script to fetch from WordPress -->
<script>
  const WP_URL = 'https://cms.verifitrust.com';
  const WP_API_URL = `${WP_URL}/wp-json/wp/v2`;

  const urlParams = new URLSearchParams(window.location.search);
  const postId = urlParams.get('id');

  if (postId) {
    fetch(`${WP_API_URL}/posts/${postId}?_embed`)
      .then(response => response.json())
      .then(post => {
        const date = new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        
        document.title = post.title.rendered + ' — Verifitrust';
        document.getElementById('post-date').innerText = `Published · ${date}`;
        document.getElementById('post-title').innerHTML = post.title.rendered;
        document.getElementById('post-content').innerHTML = post.content.rendered;

        // Dynamic Category & Back Button Logic
        let isCaseStudy = false;
        let categoryName = 'Blog';
        if(post._embedded && post._embedded['wp:term']) {
          const cats = post._embedded['wp:term'].flat().filter(t => t.taxonomy === 'category');
          if(cats.length > 0) {
            categoryName = cats[0].name;
            if(categoryName.toLowerCase().includes('case')) {
              isCaseStudy = true;
            }
          }
        }

        // Update Category Tag
        document.getElementById('post-category').innerText = isCaseStudy ? 'Case Study' : categoryName;

        // Update Back Button (FIXED PATHS)
        if(isCaseStudy) {
          document.getElementById('back-btn').href = '/resources/case-studies.html';
          document.getElementById('back-text').innerText = 'Back to Case Studies';
        } else {
          document.getElementById('back-btn').href = '/resources/blog.html';
          document.getElementById('back-text').innerText = 'Back to Blog';
        }

        // Display Image
        const imgContainer = document.getElementById('post-image-container');
        if (post._embedded && post._embedded['wp:featuredmedia'] && imgContainer) {
          const imageUrl = post._embedded['wp:featuredmedia'][0].source_url;
                    imgContainer.innerHTML = `<img src="${imageUrl}" alt="${post.title.rendered}" class="w-full h-auto object-cover rounded-2xl mb-10 fade-up visible shadow-lg">`;
        }

        // Setup Share Buttons
        const postUrl = window.location.href; 
        const postTitle = post.title.rendered;
        document.getElementById('share-linkedin').href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(postUrl)}`;
        document.getElementById('share-twitter').href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(postTitle)}&url=${encodeURIComponent(postUrl)}`;
        document.getElementById('share-facebook').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(postUrl)}`;
      })
      .catch(error => {
        document.getElementById('post-content').innerHTML = '<p class="text-red-500">Article not found.</p>';
      });
  } else {
    document.getElementById('post-content').innerHTML = '<p>No article specified.</p>';
  }

  // Copy Link Functionality
  const copyBtn = document.getElementById('copy-link-btn');
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(window.location.href).then(() => {
      const icon = copyBtn.querySelector('i');
      const originalClass = icon.className;
      icon.className = 'fas fa-check';
      copyBtn.style.backgroundColor = '#69be28';
      copyBtn.style.color = '#071A2b';
      
      setTimeout(() => {
        icon.className = originalClass;
        copyBtn.style.backgroundColor = '';
        copyBtn.style.color = '';
      }, 2000);
    });
  });
</script>

</body>
</html>
